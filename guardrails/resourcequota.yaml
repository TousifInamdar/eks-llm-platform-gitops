apiVersion: v1
kind: ResourceQuota
metadata: { name: llm-quota, namespace: llm }
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "3"
    requests.memory: 6Gi
    limits.memory: 8Gi
    pods: "10"
    persistentvolumeclaims: "2"
    requests.storage: 30Gi
    services.loadbalancers: "0"    # no surprise AWS load balancers; we use ALB via Ingress